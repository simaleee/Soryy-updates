name: Assemble uploaded APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Join APK parts and verify SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          repo = os.environ['GH_REPO']
          name = 'Soryy-0.6.0-test11-arm64.apk'
          expected = '22a0e9700036e956d003a5758fc5db959468f067f7dc819eb36da88ae838a094'
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/441853129']))
          assert release['tag_name'] == 'v0.6.0'
          parts = sorted((a for a in release['assets'] if re.fullmatch(re.escape(name) + r'\.part\d{3}', a['name'])), key=lambda a: a['name'])
          assert len(parts) == 23, f'Expected 23 parts, found {len(parts)}'
          pathlib.Path('out').mkdir(exist_ok=True)
          target = pathlib.Path('out') / name
          with target.open('wb') as output:
              for index, asset in enumerate(parts):
                  assert asset['name'] == name + f'.part{index:03}' and asset['state'] == 'uploaded'
                  chunk = pathlib.Path('part.tmp')
                  with chunk.open('wb') as stream:
                      subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', '--retry', '3', '--config', '-', '--header', 'Accept: application/octet-stream', asset['url']], input='header = "Authorization: Bearer '+os.environ['GH_TOKEN']+'"\n', text=True, stdout=stream, check=True)
                  assert chunk.stat().st_size == asset['size']
                  with chunk.open('rb') as stream:
                      shutil.copyfileobj(stream, output)
                  print(f'Joined part {index+1}/{len(parts)}', flush=True)
          with target.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert actual == expected, f'SHA-256 mismatch: {actual}'
          assert target.stat().st_size == 384982634
          print('APK assembled; size and SHA-256 verified', flush=True)
          subprocess.run(['gh', 'release', 'upload', 'v0.6.0', str(target), '--repo', repo], check=True)
          PY
