name: Assemble uploaded APK
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      name:
        required: true
        type: string
      sha256:
        required: true
        type: string
      size:
        required: true
        type: string
      parts:
        required: true
        type: string
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Join APK parts and verify SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_TAG: ${{ inputs.tag }}
          APK_NAME: ${{ inputs.name }}
          APK_SHA: ${{ inputs.sha256 }}
          APK_SIZE: ${{ inputs.size }}
          APK_PARTS: ${{ inputs.parts }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          repo = os.environ['GH_REPO']
          tag, name, expected = [os.environ[k] for k in ['APK_TAG', 'APK_NAME', 'APK_SHA']]
          assert re.fullmatch(r'v[0-9]+[.][0-9]+[.][0-9]+', tag)
          assert re.fullmatch(r'Soryy-[0-9.]+-test[0-9]+-arm64[.]apk', name)
          assert re.fullmatch(r'[0-9a-f]{64}', expected)
          size, requested_count = int(os.environ['APK_SIZE']), int(os.environ['APK_PARTS'])
          assert 0 < requested_count < 200 and 0 < size < 2100000000
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/{tag}']))
          print(f'Release {release["id"]} exposes {len(release["assets"])} assets', flush=True)
          parts = sorted((a for a in release['assets'] if re.fullmatch(re.escape(name) + r'[.]part[0-9]{3}', a['name'])), key=lambda a: a['name'])
          if len(parts) != requested_count:
              print(f'Using {len(parts)} uploaded part(s); form requested {requested_count}', flush=True)
          count = len(parts)
          assert 0 < count < 200
          pathlib.Path('out').mkdir(exist_ok=True)
          target = pathlib.Path('out') / name
          with target.open('wb') as output:
              for index, asset in enumerate(parts):
                  assert asset['name'] == name + f'.part{index:03}' and asset['state'] == 'uploaded'
                  chunk = pathlib.Path('part.tmp')
                  with chunk.open('wb') as stream:
                      subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', '--retry', '3', '--config', '-', '--header', 'Accept: application/octet-stream', asset['url']], input='header = "Authorization: Bearer '+os.environ['GH_TOKEN']+'"\n', text=True, stdout=stream, check=True)
                  assert chunk.stat().st_size == asset['size']
                  with chunk.open('rb') as stream:
                      shutil.copyfileobj(stream, output)
                  print(f'Joined part {index+1}/{count}', flush=True)
          with target.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == expected
          assert target.stat().st_size == size
          subprocess.run(['gh', 'release', 'upload', tag, str(target), '--repo', repo], check=True)
          PY
